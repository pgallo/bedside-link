; Alarm limits for the demo. One section per parameter code.
; Limits are in the parameter's normalised unit (see ObsModel).
; Hysteresis: distance the value must travel back inside the limit to clear.
; RateLimit / RateHysteresis: absolute change per minute.
; OnsetSamples: consecutive samples beyond the limit before raising.

[defaults]
Priority=medium
Latching=false

[HR]
HighLimit=120
LowLimit=45
Hysteresis=5
RateLimit=40
RateHysteresis=10
HighPriority=medium
LowPriority=high
RatePriority=low

[SPO2]
LowLimit=90
Hysteresis=2
Priority=high
Latching=true
OnsetSamples=2

[TEMP]
HighLimit=38.5
LowLimit=35.0
Hysteresis=0.2
Priority=low

[PIP]
HighLimit=35
Hysteresis=3
RateLimit=30
RateHysteresis=10
HighPriority=high
RatePriority=medium
Latching=true

[INF_OCCL]
HighLimit=0.5
Hysteresis=0.5
Priority=high
Latching=true
