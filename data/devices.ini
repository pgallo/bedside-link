; Device channels for the demo. Each [device.<id>] section binds a driver
; kind to a bed and a transport. The demo uses recorded replays; MaxChunk and
; Seed control how the replay fragments the stream.

[gateway]
PointOfCare=ICU1
AlarmConfig=alarms.ini

[device.MON-0107]
Kind=monitor
Bed=BED01
Replay=monitor_bed01.bin
MaxChunk=9
Seed=7

[device.VEN-0311]
Kind=ventilator
Bed=BED01
Replay=ventilator_bed01.bin
MaxChunk=5
Seed=11

[device.PMP-0420]
Kind=infusion
Bed=BED02
Replay=pump_bed02.bin
MaxChunk=13
Seed=3
